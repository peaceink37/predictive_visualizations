[tool.poetry]
name = "api"
version = "0.1.0"
description = "Application server for Predictive Visualizations"
authors = ["Kelly <kelly@facetlens.studio>"]
readme = "README.md"
package-mode = true
packages = [
    { include = "app" }
]

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "^0.128.0"
uvicorn = {extras = ["standard"], version = "^0.40.0"}
motor = "^3.7.1"
pydantic-settings = "^2.12.0"


[tool.poetry.group.dev.dependencies]
ruff = "^0.14.11"
pytest = "^9.0.2"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
